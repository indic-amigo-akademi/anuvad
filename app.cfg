[app]
name = Anuvad
version = 1.0

[paths]
data_dir = data
default_export_dir = exports

[user]
author = Purbayan Chowdhury(chowdhury.purbayan@gmail.com)

[language]
default_source = en
default_target = bn
auto_detect = true

[ui]
theme = dark
font_family = 'Segoe UI', 'Nirmala UI', sans-serif
font_size = 14
font_size_md = 16
font_size_lg = 18